<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreador GPS - Mapbox</title>
    
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css' rel='stylesheet' />
    
    <script src='https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.0/mapbox-gl-draw.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.0/mapbox-gl-draw.css' rel='stylesheet' />
    
    <script src='https://unpkg.com/@turf/turf@6/turf.min.js'></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: row; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            height: 100vh; 
            background: #1a1a1a;
        }
        #mapa-contenedor { position: relative; width: 75%; height: 100%; }
        #mapa { width: 100%; height: 100%; }
        #panel { 
            width: 25%; 
            padding: 20px; 
            background: #1a1a1a; 
            color: white; 
            box-shadow: -2px 0 10px rgba(0,0,0,0.5);
            z-index: 10;
            display: flex;
            flex-direction: column;
        }
        h2 { color: #007bff; margin-top: 0; font-size: 1.5rem; }
        .dato-caja { 
            background: #2c2c2c; 
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 10px; 
            border-left: 4px solid #007bff; 
        }
        .dato-caja strong { color: #007bff; display: block; font-size: 0.8rem; text-transform: uppercase; }
        .dato-caja span { font-size: 1.1rem; font-family: monospace; }
        
        .dentro { border-left: 4px solid #28a745; }
        .dentro strong { color: #28a745; }
        .fuera { border-left: 4px solid #dc3545; animation: parpadeo 1s infinite; }
        .fuera strong { color: #dc3545; }
        .espera { border-left: 4px solid #ffc107; }
        .espera strong { color: #ffc107; }

        #instruccion {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 20;
            padding: 10px 15px;
            background: rgba(0, 123, 255, 0.9);
            color: white;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #btnConfirmar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            padding: 12px 25px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none; 
            transition: background 0.2s, transform 0.1s;
        }
        #btnConfirmar:hover { background: #218838; }
        #btnConfirmar:active { transform: translateX(-50%) scale(0.95); }

        @keyframes parpadeo {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        @media (max-width: 768px) {
            body { flex-direction: column; } 
            #mapa-contenedor { width: 100%; height: 60%; } 
            #panel { width: 100%; height: 40%; box-sizing: border-box; }
            h2 { font-size: 1.2rem; }
            .dato-caja { padding: 8px; margin-bottom: 5px; }
            #btnConfirmar { bottom: 15px; padding: 8px 18px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <div id="mapa-contenedor">
        <div id="instruccion">📐 Traza tus polígonos y presiona confirmar</div>
        <button id="btnConfirmar">✓ Confirmar Cambios</button>
        <div id="mapa"></div>
    </div>
    
    <div id="panel">
        <h2>Localización</h2>
        <div class="dato-caja"><strong>Latitud Celular</strong> <span id="lat">Cargando...</span></div>
        <div class="dato-caja"><strong>Longitud Celular</strong> <span id="lng">Cargando...</span></div>
        <div class="dato-caja"><strong>Última Conexión</strong> <span id="hora">--:--:--</span></div>
        
        <div id="cajaGeocerca" class="dato-caja dentro">
            <strong>Estado de Zona</strong> 
            <span id="estadoTexto">Sin geocerca activa</span>
        </div>

        <div style="margin-top: auto; opacity: 0.5;">
            <p><small>ID Proyecto: mapbox-83ef8</small></p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCbma1j70T7y3b1hUqlUaCw8DnoU-zzj-8",
            authDomain: "mapbox-83ef8.firebaseapp.com",
            databaseURL: "https://mapbox-83ef8-default-rtdb.firebaseio.com",
            projectId: "mapbox-83ef8",
            storageBucket: "mapbox-83ef8.firebasestorage.app",
            messagingSenderId: "64665230192",
            appId: "1:64665230192:web:62ad45ee54727bd42f4db5"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        mapboxgl.accessToken = 'pk.eyJ1IjoibHVjYXJpb3hkIiwiYSI6ImNtbTg2eGJkODBlejQycHE5bXlqeDF5d28ifQ.30H_bVMK1cvc-PA6DOZrDQ';
        
        let ultimaLatCelular = -16.533511;
        let ultimaLonCelular = -68.151969;
        let geocercaConfirmada = false;

        const map = new mapboxgl.Map({
            container: 'mapa',
            style: 'mapbox://styles/mapbox/dark-v10', 
            center: [ultimaLonCelular, ultimaLatCelular],
            zoom: 14
        });

        const markerCelular = new mapboxgl.Marker({ color: '#dc3545' }) 
            .setLngLat([ultimaLonCelular, ultimaLatCelular])
            .addTo(map);

        const draw = new MapboxDraw({
            displayControlsDefault: false,
            controls: {
                polygon: true, 
                trash: true    
            },
            defaultMode: 'simple_select'
        });
        map.addControl(draw, 'top-right');

        // Función matemática adaptada para iterar sobre MÚLTIPLES polígonos concurrentes
        function verificarEstadoGeocerca() {
            const dataGeojson = draw.getAll();
            const caja = document.getElementById('cajaGeocerca');
            const texto = document.getElementById('estadoTexto');
            const btn = document.getElementById('btnConfirmar');

            if (dataGeojson.features.length > 0) {
                if (!geocercaConfirmada) {
                    caja.className = "dato-caja espera";
                    texto.innerText = "Configurando zona...";
                    return;
                }

                const puntoCelular = turf.point([ultimaLonCelular, ultimaLatCelular]);
                let dispositivoSeguro = false;

                // Evaluamos uno por uno si el celular está dentro de AL MENOS uno de los polígonos activos
                for (let i = 0; i < dataGeojson.features.length; i++) {
                    const poligono = dataGeojson.features[i];
                    if (turf.booleanPointInPolygon(puntoCelular, poligono)) {
                        dispositivoSeguro = true;
                        break; // Con entrar a uno basta para estar seguro
                    }
                }

                if (dispositivoSeguro) {
                    caja.className = "dato-caja dentro";
                    texto.innerText = "ZONA SEGURA";
                } else {
                    caja.className = "dato-caja fuera";
                    texto.innerText = "¡FUERA DE RANGO!";
                }
            } else {
                geocercaConfirmada = false;
                btn.style.display = "none";
                caja.className = "dato-caja dentro";
                texto.innerText = "Sin geocerca activa";
            }
        }

        // Sincroniza la colección entera actual a Firebase y al LocalStorage
        function guardarEstadoActual() {
            const dataGeojson = draw.getAll();
            if (dataGeojson.features.length > 0) {
                const geoJsonStr = JSON.stringify(dataGeojson);
                localStorage.setItem('geocerca_backup', geoJsonStr);

                db.ref('geocerca').set({
                    geoJsonStr: geoJsonStr
                }, (error) => {
                    if (error) console.log("Error al sincronizar: ", error);
                });
            } else {
                // Si la última figura fue borrada, se limpia la nube por completo de forma controlada
                localStorage.removeItem('geocerca_backup');
                db.ref('geocerca').remove();
            }
        }

        document.getElementById('btnConfirmar').addEventListener('click', function() {
            if (draw.getMode() === 'draw_polygon') {
                draw.changeMode('simple_select'); 
            }
            geocercaConfirmada = true;
            this.style.display = "none"; 
            
            guardarEstadoActual();
            verificarEstadoGeocerca(); 
        });

        map.on('load', () => {
            const backup = localStorage.getItem('geocerca_backup');
            if (backup) {
                const geojson = JSON.parse(backup);
                draw.add(geojson);
                geocercaConfirmada = true;
                verificarEstadoGeocerca();
            }

            db.ref('geocerca').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.geoJsonStr) {
                    if (data.geoJsonStr !== localStorage.getItem('geocerca_backup')) {
                        localStorage.setItem('geocerca_backup', data.geoJsonStr);
                        draw.deleteAll();
                        draw.add(JSON.parse(data.geoJsonStr));
                        geocercaConfirmada = true;
                        verificarEstadoGeocerca();
                    }
                }
            });
        });

        // 💥 SOLUCIÓN AL BORRADO COMPARTIDO: En lugar de demoler el nodo, actualiza Firebase con los polígonos que sobrevivieron
        map.on('draw.delete', () => {
            guardarEstadoActual();
            verificarEstadoGeocerca();
        });

        map.on('draw.modechange', (e) => {
            const btn = document.getElementById('btnConfirmar');
            if (e.mode === 'draw_polygon') {
                geocercaConfirmada = false; 
                btn.style.display = "block"; 
                verificarEstadoGeocerca();
            }
        });

        map.on('draw.create', verificarEstadoGeocerca);
        
        map.on('draw.update', () => {
            geocercaConfirmada = false;
            document.getElementById('btnConfirmar').style.display = "block";
            verificarEstadoGeocerca();
        });

        db.ref('ubicacion').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                ultimaLatCelular = data.latitud;
                ultimaLonCelular = data.longitud;

                document.getElementById('lat').innerText = ultimaLatCelular.toFixed(6);
                document.getElementById('lng').innerText = ultimaLonCelular.toFixed(6);
                document.getElementById('hora').innerText = data.tiempo;

                markerCelular.setLngLat([ultimaLonCelular, ultimaLatCelular]);
                verificarEstadoGeocerca();
            }
        });
    </script>
</body>
</html>
